<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Practice workspace for JavaScript tasks">
  <title>Practice Workspace</title>
  <style>
    :root {
      --bg: #1f2329;
      --bg-soft: #262b33;
      --card: #f1f3f5;
      --text: #17191c;
      --muted: #58606b;
      --line: #d6dbe1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #303744 0%, transparent 55%),
        radial-gradient(900px 400px at 90% -20%, #2a313d 0%, transparent 50%),
        var(--bg);
      line-height: 1.45;
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 36px 20px 56px;
    }

    .sheet {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.4vw, 2.1rem);
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .links {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .links a {
      display: block;
      text-decoration: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="shell">
  <section class="sheet">
    <h1>Practice Workspace</h1>
    <p>Быстрый вход в тренировочные папки.</p>
    <div class="links">
      <a href="./default/default.html">default/default.html</a>
      <a href="./pet-practice/index.html">pet-practice/index.html</a>
    </div>
  </section>
</div>
</body>
</html>
