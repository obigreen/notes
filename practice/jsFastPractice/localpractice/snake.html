<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: white;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="600" height="600"></canvas>

<script>
    // Set up the canvas
    const canvas = document.getElementById('gameCanvas');
    const startPosition = {
        x: canvas.width / 2,
        y: canvas.height / 2
    }
    canvas.width = 600;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');

    // Snake head
    let snake = startPosition
    let direction = 'stop';

    // Food
    let food = {
        x: Math.floor(Math.random() * (canvas.width / 20)) * 20,
        y: Math.floor(Math.random() * (canvas.height / 20)) * 20
    };

    // Score
    let score = 0;
    let highScore = 0;

    // Functions to change direction
    function goUp() {
        if (direction !== 'down') direction = 'up';
    }

    function goDown() {
        if (direction !== 'up') direction = 'down';
    }

    function goLeft() {
        if (direction !== 'right') direction = 'left';
    }

    function goRight() {
        if (direction !== 'left') direction = 'right';
    }

    // Move the snake
    function move() {
        let head = {...snake[0]};
        switch (direction) {
            case 'up':
                head.y -= 20;
                break;
            case 'down':
                head.y += 20;
                break;
            case 'left':
                head.x -= 20;
                break;
            case 'right':
                head.x += 20;
                break;
        }

        // Add new head to the front of the snake
        snake.unshift(head);

        // Check for collision with food
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            if (score > highScore) highScore = score;
            food = {
                x: Math.floor(Math.random() * (canvas.width / 20)) * 20,
                y: Math.floor(Math.random() * (canvas.height / 20)) * 20
            };
        } else {
            snake.pop(); // Remove the last segment if no food is eaten
        }
    }

    // Check for collisions
    function checkCollision() {
        let head = snake[0];
        // Check for collision with walls
        // if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        //     // resetGame();
        //     // убираем ресет гейм при встрече с границей и пока сетаем просто на точку спавна
        //     head.x = Math.floor(Math.random() * (canvas.width / 20)) * 20
        //     head.y = Math.floor(Math.random() * (canvas.height / 20)) * 20
        //
        // }


        if (head.x < 0) {
            head.x = canvas.width - 20
        } else if (head.x >= canvas.width) {
            head.x = 0
        }

        if (head.y < 0) {
            head.y = canvas.height - 20
        } else if (head.y >= canvas.height) {
            head.y = 0
        }

        // Check for collision with itself
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                resetGame();
            }
        }
    }

    // Reset the game
    function resetGame() {
        snake = startPosition;
        direction = 'stop';
        score = 0;
    }

    // Draw everything
    function draw() {
        // Clear the canvas
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw the snake
        ctx.fillStyle = 'green';
        snake.forEach(segment => {
            ctx.fillRect(segment.x, segment.y, 20, 20);
        });

        // Draw the food
        ctx.fillStyle = 'red';
        ctx.fillRect(food.x, food.y, 20, 20);

        // Draw the score
        ctx.fillStyle = 'white';
        ctx.font = '24px Courier';
        ctx.fillText(`Score: ${score}  High Score: ${highScore}`, 10, 580);
    }

    // Main game loop
    function gameLoop() {
        move();
        checkCollision();
        draw();
        setTimeout(gameLoop, 100);
    }

    document.addEventListener('keydown', event => {
        switch (event.key) {
            case 'w' || 'ц':
                goUp();
                break;
            case 's' || 'ы':
                goDown();
                break;
            case 'a' || 'ф':
                goLeft();
                break;
            case 'd' || 'в':
                goRight();
                break;
        }
    });

    gameLoop();
</script>
</body>
</html>
